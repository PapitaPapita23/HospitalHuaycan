name: Integración Continua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Construir Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./HospitalHuaycan
    
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./HospitalHuaycan/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter (Análisis de código)
        run: npm run lint

      - name: Construir Aplicación
        run: npm run build

  backend:
    name: Construir Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construir con Maven
       
        run: mvn clean package -DskipTests
